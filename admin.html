<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị — Dòng Chảy Lịch Sử</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2b0d12">
  <meta property="og:site_name" content="Dòng Chảy Lịch Sử">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="vi_VN">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232b0d12'/><text x='50' y='72' font-family='Georgia' font-size='64' font-weight='700' fill='%23c9a227' text-anchor='middle'>H</text></svg>">
</head>
<body data-page="admin">
  <div id="header-slot"></div>

  <main>
    <div class="admin-wrap">
      <div style="margin-bottom:2rem">
        <span class="kicker" data-i18n="admin.title"></span>
        <h1 style="font-size:clamp(2rem,5vw,3rem);margin-top:0.6rem" data-i18n="admin.title"></h1>
        <p style="color:var(--text-soft)" data-i18n="admin.subtitle"></p>
      </div>

      <!-- Kết nối -->
      <div class="panel">
        <div class="field">
          <label data-i18n="admin.token"></label>
          <input type="password" id="tokenInput" placeholder="ghp_…" autocomplete="off">
          <div class="hint" data-i18n="admin.tokenhint"></div>
        </div>
        <div class="admin-actions">
          <button class="btn" id="saveToken" data-i18n="admin.tokensave"></button>
          <button class="btn btn--ghost" id="connectBtn" data-i18n="admin.connect"></button>
        </div>
        <div id="connInfo" style="margin-top:1rem;display:flex;flex-wrap:wrap;gap:0.5rem"></div>
      </div>

      <!-- Editor -->
      <div class="panel">
        <div class="field">
          <label data-i18n="admin.f.type"></label>
          <div class="type-toggle" id="typeToggle" role="tablist">
            <button type="button" data-type="event" class="active" data-i18n="admin.type.event"></button>
            <button type="button" data-type="figure" data-i18n="admin.type.figure"></button>
          </div>
        </div>
        <div class="field">
          <label data-i18n="admin.load"></label>
          <select id="loadSelect"></select>
        </div>

        <div class="field import-row">
          <label data-i18n="admin.import"></label>
          <div class="import-actions">
            <button type="button" class="btn btn--ghost" id="importDocxBtn" data-i18n="admin.importdocx"></button>
            <button type="button" class="btn btn--ghost" id="importMdBtn" data-i18n="admin.importmd"></button>
            <span class="hint" data-i18n="admin.importhint"></span>
          </div>
          <input type="file" id="docxFileInput" accept=".docx" hidden>
          <input type="file" id="mdFileInput" accept=".md,.markdown,.txt" hidden>
        </div>

        <div class="field">
          <label id="lbl_title" data-i18n="admin.f.title"></label>
          <input type="text" id="f_title">
        </div>
        <div class="field-row">
          <div class="field"><label data-i18n="admin.f.slug"></label><input type="text" id="f_slug"></div>
          <div class="field"><label data-i18n="admin.f.lang"></label>
            <select id="f_lang"><option value="vi">Tiếng Việt</option><option value="en">English</option></select>
          </div>
        </div>
        <div class="field-row" data-only="event">
          <div class="field"><label data-i18n="admin.f.date"></label><input type="date" id="f_date"></div>
          <div class="field"><label id="lbl_year" data-i18n="admin.f.year"></label><input type="text" id="f_year" placeholder="1965"></div>
        </div>
        <div class="field-row" data-only="figure">
          <div class="field"><label data-i18n="admin.f.born"></label><input type="text" id="f_born" placeholder="1452"></div>
          <div class="field"><label data-i18n="admin.f.died"></label><input type="text" id="f_died" placeholder="1519"></div>
        </div>
        <div class="field-row" data-only="figure">
          <div class="field"><label data-i18n="admin.f.role"></label><input type="text" id="f_role" placeholder="Họa sĩ · Nhà phát minh"></div>
          <div class="field"><label data-i18n="admin.f.field"></label><input type="text" id="f_fieldv" placeholder="Nghệ thuật · Khoa học"></div>
        </div>
        <div class="field-row">
          <div class="field"><label data-i18n="admin.f.region"></label>
            <select id="f_region">
              <option value="vietnam" data-i18n="region.vietnam"></option>
              <option value="world" data-i18n="region.world"></option>
            </select>
          </div>
          <div class="field"><label data-i18n="admin.f.era"></label>
            <input type="text" id="f_era" list="eraList" placeholder="Cổ đại / Trung đại / Cận đại / Hiện đại">
            <datalist id="eraList">
              <option value="Cổ đại"></option><option value="Trung đại"></option>
              <option value="Cận đại"></option><option value="Hiện đại"></option>
              <option value="Phục Hưng"></option>
            </datalist>
          </div>
        </div>
        <div class="field"><label data-i18n="admin.f.tags"></label><input type="text" id="f_tags" placeholder="Việt Nam, chiến tranh"></div>
        <div class="field"><label id="lbl_cover" data-i18n="admin.f.cover"></label>
          <div class="cover-row">
            <input type="url" id="f_cover" placeholder="https://…">
            <button type="button" class="btn btn--ghost" id="coverUploadBtn" data-i18n="admin.uploadcover"></button>
          </div>
          <input type="file" id="coverFileInput" accept="image/*,.jpg,.jpeg,.png,.webp,.avif,.gif,.svg,.bmp,.tif,.tiff,.heic,.heif" hidden>
        </div>

        <div class="field" data-only="event">
          <label data-i18n="admin.f.location"></label>
          <div class="hint" data-i18n="admin.locationhint"></div>
          <div class="map-picker glass" id="mapPicker"></div>
          <div class="field-row" style="margin-top:0.8rem">
            <div class="field"><label data-i18n="admin.f.lat">Lat</label><input type="number" step="0.0001" id="f_lat" placeholder="21.0285"></div>
            <div class="field"><label data-i18n="admin.f.lng">Lng</label><input type="number" step="0.0001" id="f_lng" placeholder="105.8542"></div>
          </div>
          <div class="field"><label data-i18n="admin.f.place"></label><input type="text" id="f_place" placeholder="Hà Nội, Việt Nam"></div>
        </div>
        <div class="field"><label data-i18n="admin.f.excerpt"></label><textarea id="f_excerpt" style="min-height:80px"></textarea></div>
        <div class="field">
          <label data-i18n="admin.f.content"></label>
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;margin-bottom:0.75rem">
            <div class="lang-tabs" id="langTabs" role="tablist">
              <button type="button" data-lang="vi" class="active">Nội dung (VI)<span class="dot"></span></button>
              <button type="button" data-lang="en">Nội dung (EN)<span class="dot"></span></button>
            </div>
            <button type="button" class="btn btn--sm btn--gold" id="autoTranslateBtn" title="Dịch tự động nội dung & các trường thông tin">
              <span id="transIcon">🌐</span> <span id="transLabel" data-i18n="admin.autotranslate">Dịch tự động sang EN</span>
            </button>
          </div>
          <div class="md-toolbar" id="mdToolbar">
            <button type="button" class="md-tool" data-md="h2" title="Tiêu đề mục">H2</button>
            <button type="button" class="md-tool" data-md="h3" title="Tiêu đề phụ">H3</button>
            <button type="button" class="md-tool" data-md="bold" title="Đậm"><b>B</b></button>
            <button type="button" class="md-tool" data-md="italic" title="Nghiêng"><i>I</i></button>
            <button type="button" class="md-tool" data-md="quote" title="Trích dẫn">❝</button>
            <button type="button" class="md-tool" data-md="ul" title="Danh sách">• —</button>
            <button type="button" class="md-tool" data-md="link" title="Liên kết">🔗</button>
            <button type="button" class="md-tool md-tool--accent" id="openImgModalBtn" title="Tải / chèn ảnh với chú thích & căn lề">🖼 <span data-i18n="admin.insertimg">Chèn ảnh</span></button>
            <button type="button" class="md-tool" data-md="upload" title="Tải nhanh một hoặc nhiều ảnh từ máy" data-i18n="admin.uploadimg">Tải ảnh</button>
            <button type="button" class="md-tool" data-md="hr" title="Đường kẻ">―</button>
            <button type="button" class="md-tool" data-md="ref" title="Mục nguồn tham khảo">Tham khảo</button>
          </div>
          <textarea id="f_content" placeholder="# Tiêu đề&#10;&#10;Nội dung Markdown… (mẹo: dán ảnh trực tiếp vào đây để tải lên, hoặc bấm nút 'Chèn ảnh')"></textarea>
          <input type="file" id="imgFileInput" accept="image/*,.jpg,.jpeg,.png,.webp,.avif,.gif,.svg,.bmp,.tif,.tiff,.heic,.heif" multiple hidden>

          <!-- Khay ảnh đính kèm / đang chờ trong bài -->
          <div id="stagedTray" class="staged-tray glass" style="display:none">
            <div class="staged-tray__head">
              <span class="staged-tray__title">🖼 <b data-i18n="admin.stagedtray">Khay ảnh đính kèm</b> (<span id="stagedCount">0</span>)</span>
              <button type="button" class="btn btn--sm btn--ghost" id="addMoreImagesBtn">+ Thêm ảnh từ máy</button>
            </div>
            <div id="stagedList" class="staged-tray__grid"></div>
          </div>
        </div>

        <div class="admin-actions">
          <button class="btn" id="publishBtn" data-i18n="admin.publish"></button>
          <button class="btn btn--ghost" id="previewBtn" data-i18n="admin.preview"></button>
          <button class="btn btn--ghost" id="newBtn" data-i18n="admin.new"></button>
          <button class="btn btn--ghost" id="deleteBtn" style="display:none;color:var(--crimson);border-color:var(--crimson)" data-i18n="admin.delete"></button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
        <div id="previewBox" class="preview-box"></div>
      </div>
    </div>
  </main>

  <!-- Modal Tải & Chèn Ảnh Thông Minh -->
  <div class="img-modal" id="imageModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="img-modal__panel glass">
      <div class="img-modal__head">
        <h3 data-i18n="admin.modal.title">Tải & Chèn Ảnh Thông Minh</h3>
        <button type="button" class="img-modal__close" id="closeImgModal" aria-label="Đóng">✕</button>
      </div>
      <div class="img-modal__body">
        <div class="img-source-tabs" id="imgSourceTabs">
          <button type="button" class="active" data-tab="upload" data-i18n="admin.modal.choosefile">Chọn từ máy tính</button>
          <button type="button" data-tab="url" data-i18n="admin.modal.fromurl">Nhập URL ảnh ngoài</button>
        </div>
        <div id="srcUploadArea" class="img-dropzone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="40" height="40"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M12 12v9m-4-4 4-4 4 4"/></svg>
          <p>Kéo-thả ảnh vào đây hoặc <b>nhấp để chọn ảnh</b></p>
          <span class="hint" style="font-size:0.78rem">Hỗ trợ JPG, PNG, WEBP, AVIF, GIF, SVG… (chọn nhiều ảnh cùng lúc)</span>
        </div>
        <div id="srcUrlArea" class="field" style="display:none">
          <input type="url" id="modalImgUrl" placeholder="https://commons.wikimedia.org/... hoặc https://images.unsplash.com/...">
        </div>

        <div class="img-preview-box" id="modalImgPreview" style="display:none">
          <img id="modalImgTag" alt="">
        </div>

        <div class="field" style="margin-top:1rem">
          <label data-i18n="admin.caption">Chú thích ảnh (Caption)</label>
          <input type="text" id="modalCaption" placeholder="Ví dụ: Bãi cọc gỗ lim trên dòng sông Bạch Đằng năm 938">
        </div>

        <div class="field">
          <label data-i18n="admin.position">Vị trí căn lề</label>
          <div class="pos-selector" id="posSelector">
            <label class="pos-opt">
              <input type="radio" name="imgPos" value="right" checked>
              <span>👉 <b data-i18n="admin.pos.right">Nổi phải (Wikipedia)</b></span>
            </label>
            <label class="pos-opt">
              <input type="radio" name="imgPos" value="left">
              <span>👈 <b data-i18n="admin.pos.left">Nổi trái (Wikipedia)</b></span>
            </label>
            <label class="pos-opt">
              <input type="radio" name="imgPos" value="center">
              <span>↔ <b data-i18n="admin.pos.center">Toàn chiều rộng</b></span>
            </label>
          </div>
        </div>
      </div>
      <div class="img-modal__foot">
        <button type="button" class="btn btn--ghost" id="cancelImgModal" data-i18n="admin.modal.close">Đóng</button>
        <button type="button" class="btn" id="confirmInsertImgBtn" data-i18n="admin.modal.insert">Chèn ảnh vào bài</button>
      </div>
    </div>
  </div>

  <div id="footer-slot"></div>

  <script src="config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/translator.js"></script>
  <script src="assets/js/md.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/figures.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
